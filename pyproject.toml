[project]
name = "travel-planning-agent"
version = "0.3.0"
description = "Intelligent travel planning agent (LangGraph + FastAPI + Vue 3)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
